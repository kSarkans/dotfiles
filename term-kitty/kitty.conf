# BEGIN_KITTY_THEME
include Ubuntu.conf
# END_KITTY_THEME


font_family      family="ZedMono Nerd Font"
# font_family      family="JetBrains Mono NL"
# font_family      family="BigBlueTermPlus Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

disable_ligatures always


cursor_trail                 5
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2


background_opacity 0.85
transparent_background_colors #282828@0.8 #0B0E14@0.8 #1E1E2E@0.8 #0d1117@0.8
background_blur 1
# background_image /home/ksarkans/.local/share/wallpapers/kitty.png
# background_image_layout cscaled
# background_tint 0.80
